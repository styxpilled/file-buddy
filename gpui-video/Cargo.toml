[package]
name = "gpui-video"
version = "0.1.2"
edition = "2021"
publish = false
license = "MIT"
description = "Vendored video player element for GPUI. See README.md."

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.1" }
ffmpeg-next = "=8.1.0"
crossbeam-channel = "=0.5.17"
log = "=0.4.34"
thiserror = "=2.0.20"
url = "=2.5.8"
parking_lot = "=0.12.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "gif", "webp"] }
smallvec = "=1.16.1"
yuv = "=0.8.18"
cpal = "=0.17.3"

[dev-dependencies]
env_logger = "=0.11.11"
