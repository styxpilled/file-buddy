[package]
name = "file-buddy"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
# Heap profiling of the window with dhat-rs. It writes `dhat-heap.json` in the
# working directory when the application quits.
dhat-heap = ["dep:dhat"]

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
dhat = { version = "=0.3.3", optional = true }
clipboard-win = { version = "=5.4.1", features = ["std"] }
dunce = "1.0.5"
env_logger = "=0.11.11"
futures = "=0.3.34"
globset = "=0.4.20"
gpui = { package = "gpui-pre", version = "=0.3.1" }
gpui-kit = "=0.6.1"
gpui-video = { path = "gpui-video" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
image-webp = "=0.2.4"
log = "=0.4.34"
notify = "=8.2.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
pollster = "=0.4.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
toml = "=1.1.6"
url = "=2.5.8"
walkdir = "=2.5.0"
whisper-rs = { version = "=0.16.0", features = ["vulkan", "log_backend"] }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Frame conversion and decoding are far too slow unoptimized, so the video path
# and every dependency are built with optimization even in a debug build.
[profile.dev.package.gpui-video]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# gpui-pre-macros 0.3.1 does not compile without debug assertions: an ungated
# helper calls a module gated on `debug_assertions`.
[profile.release.package.gpui-pre-macros]
debug-assertions = true

[dev-dependencies]
globset = "=0.4.20"
tempfile = "=3.27.0"
