[package]
name = "file-buddy"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["spike/ocr"]

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clipboard-win = { version = "=5.4.1", features = ["std"] }
dunce = "1.0.5"
env_logger = "=0.11.11"
globset = "=0.4.20"
gpui = { package = "gpui-pre", version = "=0.3.1" }
gpui-kit = "=0.6.1"
gpui-video = { path = "gpui-video" }
log = "=0.4.34"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
url = "=2.5.8"
walkdir = "=2.5.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Frame conversion and decoding are far too slow unoptimized, so the video path
# and every dependency are built with optimization even in a debug build.
[profile.dev.package.gpui-video]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[dev-dependencies]
globset = "=0.4.20"
tempfile = "=3.27.0"
